<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>EM Main Page</title>

        <link rel="stylesheet" href="../css/style.css">
        <script src="../vendor/jquery/jquery-3.7.1.js"></script>
        <script src="../js/main.js"></script>
    </head>
    <body>
        <div id="header">

        </div>
        <div id="mainContainer">
            <div id="sideBarContainer">
                <img id="burgerButton" src="../images/burger.png" alt="temp graph test">
                <div id="sideBarContent" class="hidden">
                    <p>Really good p element</p>
                </div>
            </div>
            <div id="contentContainer">
                <div id="tempContainer">
                    <h2>Temps:</h2>
                    <p id="heatingMessage"></p>
                    <div>
                        <h5>Current Temp:</h5>
                        <p id="currentTemp"></p>
                    </div>
                    <div class="graphContainer">
                        <img src="../images/tempGraph1.png" alt="temp graph test">
                    </div>
                </div>
                <div id="avbContainer">
                    <h2>Gravity:</h2>
                    <div class="graphContainer">
                        <img src="../images/gravityGraph1.jpg" alt="temp graph test">
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
